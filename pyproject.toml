[project]
name = "spmv"
description = "Sparse Matrix-Vector Multiplication on Cerebras WSE"
keywords = [ "cerebras", "wse3", "qubo", "maxcut" ]

authors = [
	{name = "Daniel Renschler", email = "renschler@hlrs.de"},
]

version = "2.0.0"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "cerebras-sdk==2.10.0; sys_platform == 'linux'",
    "loguru>=0.7.3",
    "numpy",
    "numba",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "matplotlib",
    "pandas",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["sdk: requires Cerebras SDK and simulator"]
